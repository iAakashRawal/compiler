<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge - Web Compiler</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Scrollbar Styles to match the original look */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155; /* slate-700 */
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #475569; /* slate-600 */
        }
        
        /* Hide scrollbar for line numbers but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans selection:bg-blue-500/30 overflow-hidden h-screen flex flex-col md:flex-row">

    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-16 lg:w-20 bg-slate-900 border-r border-slate-800 flex flex-row md:flex-col items-center py-4 gap-4 z-10 shrink-0">
        <div class="bg-blue-600 p-2 rounded-lg mb-0 md:mb-4 shadow-lg shadow-blue-500/20">
            <i data-lucide="code-2" class="w-6 h-6 text-white"></i>
        </div>
        
        <nav class="flex flex-row md:flex-col gap-2 w-full px-2">
            <button class="p-3 rounded-lg bg-slate-800 text-blue-400 flex justify-center items-center w-full md:w-auto">
                <i data-lucide="file-code" class="w-5 h-5"></i>
            </button>
            <button class="p-3 rounded-lg text-slate-500 hover:text-slate-300 hover:bg-slate-800/50 transition-colors flex justify-center items-center w-full md:w-auto">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Header / Toolbar -->
        <header class="h-14 border-b border-slate-800 bg-slate-900/50 flex items-center justify-between px-6 shrink-0">
            <div class="flex items-center gap-3">
                <span class="font-semibold tracking-tight text-slate-100">main.js</span>
                <span class="text-xs px-2 py-0.5 rounded-full bg-yellow-500/10 text-yellow-500 font-medium">JavaScript</span>
            </div>

            <div class="flex items-center gap-3">
                <div class="hidden sm:flex items-center text-xs text-slate-500 gap-4 mr-4">
                    <span class="flex items-center gap-1.5"><i data-lucide="cpu" class="w-3.5 h-3.5"></i> Compiler Ready</span>
                    <span class="flex items-center gap-1.5"><i data-lucide="layers" class="w-3.5 h-3.5"></i> v1.0.4</span>
                </div>
                
                <button id="runBtn" class="flex items-center gap-2 px-4 py-2 rounded-md font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20">
                    <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                    <span>Run</span>
                </button>
            </div>
        </header>

        <!-- Workspace Split -->
        <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
            
            <!-- Editor Panel -->
            <section class="flex-1 flex flex-col min-h-[300px] border-b lg:border-b-0 lg:border-r border-slate-800 relative group">
                <!-- Line Numbers -->
                <div id="lineNumbers" class="absolute top-0 left-0 w-10 h-full bg-slate-900/30 border-r border-slate-800/50 text-right pr-3 pt-4 text-slate-600 font-mono text-sm select-none pointer-events-none hidden sm:block overflow-hidden">
                    <!-- Lines injected via JS -->
                </div>
                
                <textarea id="codeEditor" spellcheck="false" class="flex-1 bg-slate-950 p-4 sm:pl-12 text-slate-300 font-mono text-sm leading-6 resize-none focus:outline-none custom-scrollbar selection:bg-blue-500/30 outline-none border-none">
// Welcome to CodeForge
// Write standard JavaScript here

function fibonacci(n) {
  if (n <= 1) return n;
  return fibonacci(n - 1) + fibonacci(n - 2);
}

const n = 10;
console.log("Generating Fibonacci for n=" + n);

const result = fibonacci(n);
console.log("Result: " + result);

// Try calculating tokens!
</textarea>
                
                <!-- Status Bar -->
                <div class="h-8 bg-slate-900 border-t border-slate-800 flex items-center px-4 text-xs text-slate-500 justify-between select-none">
                    <div class="flex gap-4">
                        <span id="cursorPos">Ln 1, Col 1</span>
                        <span>UTF-8</span>
                    </div>
                    <div id="buildStatus" class="flex gap-2 items-center">
                        <!-- Status injected via JS -->
                    </div>
                </div>
            </section>

            <!-- Output / Analysis Panel -->
            <section class="h-1/2 lg:h-auto lg:w-[450px] xl:w-[600px] bg-slate-900 flex flex-col shadow-2xl z-20">
                
                <!-- Panel Tabs -->
                <div class="flex items-center border-b border-slate-800 bg-slate-925">
                    <button id="tabConsole" class="flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-colors border-blue-500 text-blue-400 bg-slate-800/50">
                        <i data-lucide="terminal" class="w-4 h-4"></i> Console
                    </button>
                    <button id="tabAnalysis" class="flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-colors border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/30">
                        <i data-lucide="layout-template" class="w-4 h-4"></i> Lexer Analysis
                    </button>
                    <div class="ml-auto px-2">
                        <button id="clearBtn" class="p-1.5 h-8 w-8 flex justify-center items-center rounded-md hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Panel Content -->
                <div id="panelContent" class="flex-1 overflow-auto bg-slate-950/50 custom-scrollbar p-4 font-mono text-sm">
                    <!-- Content injected via JS -->
                    <div class="text-slate-600 italic flex items-center gap-2">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i> Waiting for execution...
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script>
        // --- State Management ---
        const state = {
            code: document.getElementById('codeEditor').value,
            output: [],
            tokens: [],
            activeTab: 'console', // 'console' | 'analysis'
            isCompiling: false,
            status: 'ready'
        };

        // --- DOM Elements ---
        const els = {
            editor: document.getElementById('codeEditor'),
            lineNumbers: document.getElementById('lineNumbers'),
            cursorPos: document.getElementById('cursorPos'),
            buildStatus: document.getElementById('buildStatus'),
            runBtn: document.getElementById('runBtn'),
            panelContent: document.getElementById('panelContent'),
            tabConsole: document.getElementById('tabConsole'),
            tabAnalysis: document.getElementById('tabAnalysis'),
            clearBtn: document.getElementById('clearBtn')
        };

        // --- Tokenizer Logic ---
        const tokenize = (input) => {
            const tokens = [];
            let cursor = 0;

            const TOKEN_TYPES = [
                { type: 'KEYWORD', regex: /^\b(function|return|if|else|const|let|var|console|for|while|switch|case|break|continue|default|try|catch|finally|throw|class|extends|super|new|this|async|await|import|export|from|void|typeof|instanceof|do|in|of|with|debugger|yield)\b/ },
                { type: 'BOOLEAN', regex: /^\b(true|false|null|undefined)\b/ },
                { type: 'IDENTIFIER', regex: /^[a-zA-Z_$][a-zA-Z0-9_$]*/ },
                { type: 'NUMBER', regex: /^\d+(\.\d+)?/ },
                { type: 'STRING', regex: /^(['"`])(.*?)\1/ },
                { type: 'OPERATOR', regex: /^[+\-*/%=<>!&|]+/ },
                { type: 'PUNCTUATION', regex: /^[{}[\](),;.:]/ },
                { type: 'WHITESPACE', regex: /^\s+/ },
            ];

            while (cursor < input.length) {
                let match = null;
                let text = input.slice(cursor);

                for (const { type, regex } of TOKEN_TYPES) {
                    const result = regex.exec(text);
                    if (result) {
                        match = result[0];
                        if (type !== 'WHITESPACE') {
                            tokens.push({ type, value: match });
                        }
                        cursor += match.length;
                        break;
                    }
                }

                if (!match) {
                    cursor++; // Skip unknown characters
                }
            }
            return tokens;
        };

        // --- UI Rendering ---

        function updateLineNumbers() {
            const lines = state.code.split('\n').length;
            els.lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => `<div class="leading-6">${i + 1}</div>`).join('');
        }

        function updateCursorPos() {
            const text = els.editor.value;
            const cursorPos = els.editor.selectionStart;
            const lines = text.substring(0, cursorPos).split("\n");
            const currentLine = lines.length;
            const currentCol = lines[lines.length - 1].length + 1;
            els.cursorPos.innerText = `Ln ${currentLine}, Col ${currentCol}`;
        }

        function updateTabs() {
            const activeClass = "border-blue-500 text-blue-400 bg-slate-800/50";
            const inactiveClass = "border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/30";

            if (state.activeTab === 'console') {
                els.tabConsole.className = `flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-colors ${activeClass}`;
                els.tabAnalysis.className = `flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-colors ${inactiveClass}`;
                renderConsole();
            } else {
                els.tabConsole.className = `flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-colors ${inactiveClass}`;
                els.tabAnalysis.className = `flex items-center gap-2 px-6 py-3 text-sm font-medium border-b-2 transition-colors ${activeClass}`;
                renderAnalysis();
            }
        }

        function renderConsole() {
            if (state.output.length === 0) {
                els.panelContent.innerHTML = `
                    <div class="text-slate-600 italic flex items-center gap-2">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i> Waiting for execution...
                    </div>`;
            } else {
                els.panelContent.innerHTML = state.output.map(log => `
                    <div class="flex items-start gap-2 ${log.type === 'error' ? 'text-red-400 bg-red-950/30 p-2 rounded border border-red-900/50' : 'text-slate-300 border-l-2 border-slate-700 pl-2'}">
                        <span class="opacity-50 select-none text-xs mt-1">&gt;</span>
                        <span class="whitespace-pre-wrap break-all">${log.message}</span>
                    </div>
                `).join('');
            }
            lucide.createIcons();
            // Auto scroll to bottom
            els.panelContent.scrollTop = els.panelContent.scrollHeight;
        }

        function renderAnalysis() {
            if (state.tokens.length === 0) {
                els.panelContent.innerHTML = '<div class="text-center text-slate-500 py-8">Run analysis to generate tokens</div>';
                return;
            }

            const tokenGrid = state.tokens.map(token => {
                let colorClass = 'text-slate-200';
                if (token.type === 'KEYWORD') colorClass = 'text-purple-400';
                else if (token.type === 'STRING') colorClass = 'text-green-400';
                else if (token.type === 'NUMBER') colorClass = 'text-orange-400';
                else if (token.type === 'OPERATOR') colorClass = 'text-blue-400';

                return `
                <div class="flex flex-col bg-slate-800 border border-slate-700 rounded p-2 text-xs font-mono">
                    <span class="text-slate-400 text-[10px] uppercase tracking-wider mb-1">${token.type}</span>
                    <span class="break-all ${colorClass}">${token.value}</span>
                </div>`;
            }).join('');

            els.panelContent.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Token Stream</h3>
                        <span class="text-xs text-slate-600">${state.tokens.length} tokens found</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                        ${tokenGrid}
                    </div>
                    <p class="text-xs text-slate-600 mt-4 border-t border-slate-800 pt-4">
                        The lexer converts your source code string into a sequence of tokens. This is the first step in the compiler pipeline.
                    </p>
                </div>
            `;
        }

        function updateBuildStatus(status) {
            if (status === 'success') {
                els.buildStatus.innerHTML = `<span class="text-green-500 flex items-center gap-1"><i data-lucide="check-circle-2" class="w-3 h-3"></i> Build Success</span>`;
            } else if (status === 'error') {
                els.buildStatus.innerHTML = `<span class="text-red-500 flex items-center gap-1"><i data-lucide="alert-circle" class="w-3 h-3"></i> Build Failed</span>`;
            } else {
                els.buildStatus.innerHTML = '';
            }
            lucide.createIcons();
        }

        // --- Logic ---

        async function runCode() {
            state.isCompiling = true;
            state.output = [];
            state.activeTab = 'console';
            updateTabs();
            
            // UI Loading State
            els.runBtn.disabled = true;
            els.runBtn.innerHTML = `
                <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Compiling...</span>
            `;

            // Simulate delay
            await new Promise(r => setTimeout(r, 600));

            try {
                // Lexical Analysis
                state.tokens = tokenize(state.code);

                // Execution Context
                const customConsole = {
                    log: (...args) => {
                        const message = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
                        state.output.push({ type: 'log', message });
                        if(state.activeTab === 'console') renderConsole();
                    },
                    error: (...args) => {
                        const message = args.map(String).join(' ');
                        state.output.push({ type: 'error', message });
                        if(state.activeTab === 'console') renderConsole();
                    },
                    warn: (...args) => {
                         const message = '[WARN] ' + args.map(String).join(' ');
                        state.output.push({ type: 'log', message });
                        if(state.activeTab === 'console') renderConsole();
                    }
                };

                const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
                
                // Execute
                await new AsyncFunction('console', state.code)(customConsole);

                updateBuildStatus('success');
            } catch (err) {
                state.output.push({ type: 'error', message: err.toString() });
                renderConsole();
                updateBuildStatus('error');
            } finally {
                state.isCompiling = false;
                // Reset Button
                els.runBtn.disabled = false;
                els.runBtn.innerHTML = `
                    <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                    <span>Run</span>
                `;
                lucide.createIcons();
            }
        }

        // --- Event Listeners ---

        els.editor.addEventListener('input', (e) => {
            state.code = e.target.value;
            updateLineNumbers();
        });

        els.editor.addEventListener('scroll', () => {
            // Sync line numbers scroll
            els.lineNumbers.scrollTop = els.editor.scrollTop;
        });
        
        // Sync scroll of line numbers to editor (to handle external adjustments)
        els.editor.addEventListener('keyup', updateCursorPos);
        els.editor.addEventListener('click', updateCursorPos);

        els.runBtn.addEventListener('click', runCode);

        els.tabConsole.addEventListener('click', () => {
            state.activeTab = 'console';
            updateTabs();
        });

        els.tabAnalysis.addEventListener('click', () => {
            state.activeTab = 'analysis';
            updateTabs();
        });

        els.clearBtn.addEventListener('click', () => {
            state.output = [];
            state.status = 'ready';
            updateBuildStatus('ready');
            renderConsole();
        });

        // --- Init ---
        updateLineNumbers();
        lucide.createIcons();
    </script>
</body>
</html>
