<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Forza Racer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #70c4c8;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .hud-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 4px;
      border-left: 4px solid #ff4500;
    }
    #controls-hint {
      margin-top: 15px;
      color: #aaa;
      font-size: 14px;
    }
    kbd {
      background: #333;
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid #555;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <div class="hud-box">SPEED: <span id="speed">0</span> KM/H</div>
      <div class="hud-box">SCORE: <span id="score">0</span></div>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>
  </div>

  <div id="controls-hint">
    Use <kbd>▲</kbd> / <kbd>W</kbd> to Accelerate, <kbd>▼</kbd> / <kbd>S</kbd> to Brake, and <kbd>◄</kbd> <kbd>►</kbd> / <kbd>A</kbd> <kbd>D</kbd> to Steer.
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const speedEl = document.getElementById('speed');
    const scoreEl = document.getElementById('score');

    // Canvas Constants
    const CANVAS_WIDTH = canvas.width;
    const CANVAS_HEIGHT = canvas.height;
    const ROAD_WIDTH = 2000;
    const SEGMENT_LENGTH = 200;
    const RUMBLE_LENGTH = 3;
    const CAMERA_HEIGHT = 1000;
    const DRAW_DISTANCE = 300;

    // Physics Constants
    const MAX_SPEED = 12000;
    const ACCEL = 40;
    const BREAKING = 100;
    const DECEL = 20;
    const OFF_ROAD_DECEL = 150;

    // Player State
    let playerX = 0; // -1 (left edge) to 1 (right edge)
    let position = 0; // Position along the road
    let speed = 0;
    let score = 0;

    // Keys State
    const keys = { Left: false, Right: false, Faster: false, Slower: false };

    // Track Segments Definition
    const segments = [];

    // Helper Math Functions
    function project(p, cameraX, cameraY, cameraZ, cameraDepth) {
      p.camera.x = (p.world.x || 0) - cameraX;
      p.camera.y = (p.world.y || 0) - cameraY;
      p.camera.z = (p.world.z || 0) - cameraZ;
      p.screen.scale = cameraDepth / p.camera.z;
      p.screen.x = Math.round((CANVAS_WIDTH / 2) + (p.screen.scale * p.camera.x * CANVAS_WIDTH / 2));
      p.screen.y = Math.round((CANVAS_HEIGHT / 2) - (p.screen.scale * p.camera.y * CANVAS_HEIGHT / 2));
      p.screen.w = Math.round(p.screen.scale * ROAD_WIDTH * CANVAS_WIDTH / 2);
    }

    // Build Track
    function buildTrack() {
      const addSegment = (curve) => {
        const n = segments.length;
        segments.push({
          index: n,
          p1: { world: { z: n * SEGMENT_LENGTH }, camera: {}, screen: {} },
          p2: { world: { z: (n + 1) * SEGMENT_LENGTH }, camera: {}, screen: {} },
          curve: curve,
          color: Math.floor(n / RUMBLE_LENGTH) % 2 ? 
            { grass: '#10aa10', rumble: '#555555', road: '#444444' } : 
            { grass: '#009900', rumble: '#ffffff', road: '#484848' }
        });
      };

      // Add straight & curved road sections
      for (let i = 0; i < 100; i++) addSegment(0);
      for (let i = 0; i < 100; i++) addSegment(2);
      for (let i = 0; i < 100; i++) addSegment(-2);
      for (let i = 0; i < 100; i++) addSegment(0);
      for (let i = 0; i < 150; i++) addSegment(4);
      for (let i = 0; i < 100; i++) addSegment(-3);
      for (let i = 0; i < 200; i++) addSegment(0);
    }

    // Drawing Primitives
    function renderPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x3, y3);
      ctx.lineTo(x4, y4);
      ctx.closePath();
      ctx.fill();
    }

    function renderSegment(segment) {
      const p1 = segment.p1;
      const p2 = segment.p2;

      // Draw Grass
      ctx.fillStyle = segment.color.grass;
      ctx.fillRect(0, p2.screen.y, CANVAS_WIDTH, p1.screen.y - p2.screen.y);

      // Draw Rumble Strips
      const r1 = p1.screen.w * 0.15;
      const r2 = p2.screen.w * 0.15;
      renderPolygon(
        p1.screen.x - p1.screen.w - r1, p1.screen.y,
        p1.screen.x - p1.screen.w, p1.screen.y,
        p2.screen.x - p2.screen.w, p2.screen.y,
        p2.screen.x - p2.screen.w - r2, p2.screen.y,
        segment.color.rumble
      );
      renderPolygon(
        p1.screen.x + p1.screen.w + r1, p1.screen.y,
        p1.screen.x + p1.screen.w, p1.screen.y,
        p2.screen.x + p2.screen.w, p2.screen.y,
        p2.screen.x + p2.screen.w + r2, p2.screen.y,
        segment.color.rumble
      );

      // Draw Main Road
      renderPolygon(
        p1.screen.x - p1.screen.w, p1.screen.y,
        p1.screen.x + p1.screen.w, p1.screen.y,
        p2.screen.x + p2.screen.w, p2.screen.y,
        p2.screen.x - p2.screen.w, p2.screen.y,
        segment.color.road
      );
    }

    function renderPlayer() {
      const carWidth = 120;
      const carHeight = 60;
      const carX = CANVAS_WIDTH / 2 - carWidth / 2;
      const carY = CANVAS_HEIGHT - carHeight - 20;

      // Car Body
      ctx.fillStyle = '#ff2200';
      ctx.fillRect(carX, carY + 15, carWidth, carHeight - 15);
      
      // Car Cabin
      ctx.fillStyle = '#111';
      ctx.fillRect(carX + 20, carY, carWidth - 40, 20);

      // Tail Lights
      ctx.fillStyle = speed > 0 && keys.Slower ? '#ffff00' : '#ff0000';
      ctx.fillRect(carX + 5, carY + 20, 20, 10);
      ctx.fillRect(carX + carWidth - 25, carY + 20, 20, 10);

      // Wheels
      ctx.fillStyle = '#000';
      ctx.fillRect(carX - 5, carY + 30, 10, 25);
      ctx.fillRect(carX + carWidth - 5, carY + 30, 10, 25);
    }

    // Input Handling
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.Left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.Right = true;
      if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.Faster = true;
      if (['ArrowDown', 's', 'S'].includes(e.key)) keys.Slower = true;
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.Left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.Right = false;
      if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.Faster = false;
      if (['ArrowDown', 's', 'S'].includes(e.key)) keys.Slower = false;
    });

    // Main Game Loop
    function update(dt) {
      const trackLength = segments.length * SEGMENT_LENGTH;
      
      // Handle Acceleration & Braking
      if (keys.Faster) speed += ACCEL;
      else if (keys.Slower) speed -= BREAKING;
      else speed -= DECEL;

      // Off-road penalty
      if ((playerX < -1 || playerX > 1) && speed > MAX_SPEED / 4) {
        speed -= OFF_ROAD_DECEL;
      }

      speed = Math.max(0, Math.min(speed, MAX_SPEED));

      // Advance Position
      position = (position + speed * dt) % trackLength;

      // Current Segment
      const currentSegment = segments[Math.floor(position / SEGMENT_LENGTH)];
      const speedRatio = speed / MAX_SPEED;

      // Steering (scaled with current speed)
      if (keys.Left) playerX -= 0.03 * speedRatio;
      if (keys.Right) playerX += 0.03 * speedRatio;

      // Apply centrifugal force on curves
      playerX -= (currentSegment.curve * speedRatio * 0.015);
      playerX = Math.max(-2, Math.min(playerX, 2)); // Clamp position

      // Score based on distance driven
      if (speed > 0) score += Math.floor(speed * dt * 0.1);

      // Update UI
      speedEl.innerText = Math.floor((speed / MAX_SPEED) * 280); // Display top speed ~280 km/h
      scoreEl.innerText = score;
    }

    function render() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // Render Sky/Background
      ctx.fillStyle = '#3575b5';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT / 2);

      const baseSegment = segments[Math.floor(position / SEGMENT_LENGTH)];
      let dx = -baseSegment.curve * (position % SEGMENT_LENGTH / SEGMENT_LENGTH);
      let x = 0;

      const cameraDepth = 1 / Math.tan((80 / 2) * Math.PI / 180);

      // Draw Segments from Back to Front
      for (let n = 0; n < DRAW_DISTANCE; n++) {
        const segment = segments[(baseSegment.index + n) % segments.length];
        const loop = segment.index < baseSegment.index ? segments.length * SEGMENT_LENGTH : 0;

        project(
          segment.p1, 
          (playerX * ROAD_WIDTH) - x, 
          CAMERA_HEIGHT, 
          position - loop, 
          cameraDepth
        );
        
        project(
          segment.p2, 
          (playerX * ROAD_WIDTH) - x - dx, 
          CAMERA_HEIGHT, 
          position - loop, 
          cameraDepth
        );

        x += dx;
        dx += segment.curve;

        if (segment.p1.camera.z <= cameraDepth || segment.p2.screen.y >= segment.p1.screen.y) {
          continue;
        }

        renderSegment(segment);
      }

      // Render Player Car
      renderPlayer();
    }

    let lastTime = performance.now();
    function frame(time) {
      const dt = Math.min(1, (time - lastTime) / 1000);
      lastTime = time;

      update(dt);
      render();

      requestAnimationFrame(frame);
    }

    // Initialization
    buildTrack();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
